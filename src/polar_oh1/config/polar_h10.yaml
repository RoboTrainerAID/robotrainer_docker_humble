polar_h10_node:
  ros__parameters:
    # Leave empty to connect to the first "Polar H10" found, or give the MAC
    # address ("A0:9E:1A:E0:BC:97") or a substring of the advertised name
    # ("Polar H10 554C6327" -> "554C6327").
    address: "24:AC:AC:1E:C2:03"
    adapter: "hci1"                     # e.g. "hci1" for a dedicated USB dongle
    frame_id: "polar_h10"
    topic_prefix: "biosensors/polar_h10"

    scan_timeout: 15.0
    reconnect_delay: 5.0
    battery_period: 60.0

    publish_ecg: true
    publish_acc: false
    publish_hrv: true

    ecg_sample_rate: 130            # the H10 only supports 130 Hz
    acc_sample_rate: 200            # 25 / 50 / 100 / 200
    acc_range_g: 8                  # 2 / 4 / 8
    acc_in_g: false                 # false -> m/s^2 (REP-103)

    # HRV is published on every accepted beat, stamped with that beat's time,
    # so there is no publishing lag. The window only decides how far BACK each
    # value looks. Sizing rule: at ~70 bpm you get ~1.2 beats/s, so
    # hrv_window_sec * 1.2 must comfortably exceed hrv_min_beats or nothing is
    # published at all. For short (~10 s) trials, see the README: record the
    # raw R-R topic and compute task-aligned HRV offline.
    hrv_window_sec: 30.0
    hrv_min_beats: 10
    rr_min_ms: 300.0                # 200 bpm
    rr_max_ms: 2000.0               # 30 bpm
    rr_max_rel_change: 0.25         # Malik-style ectopic / dropped-beat filter

    high_rate_queue_depth: 400
    low_rate_queue_depth: 50
